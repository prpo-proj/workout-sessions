openapi: "3.1.0"
info:
  title: Workout Sessions API
  description: "Log strength workouts, record exercises and sets, and review workout history for the authenticated user."
  version: 1.0.0
  contact:
      name: Workout Tracker
      url: https://github.com/prpo-proj/workout-sessions
servers:
  - url: http://localhost:8080/v1

tags:
  - name: Sessions
    description: "Start, finish, retrieve, and delete workout sessions."

  - name: SessionExercises
    description: Add and remove exercise entries in a workout session.

  - name: Sets
    description: "Log, correct, and delete sets within a workout."

paths:
  /sessions:
    get:
      tags:
        - Sessions
      summary: List workout sessions
      description: "Lists the authenticated user's sessions, newest start time first, then by ID ascending for ties. Defaults to completed sessions. Filter by ACTIVE to find the current workout."
      operationId: getSessions
      security:
        - bearerAuth: []
      
      parameters:
        - name: status
          in: query
          required: false
          description: "Session status to include. Defaults to COMPLETED. ACTIVE can match at most one session."
          schema:
            type: string
            enum:
              - ACTIVE
              - COMPLETED
            default: COMPLETED
        
        - name: limit
          in: query
          required: false
          description: "Maximum number of sessions to return on this page."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        
        - name: offset
          in: query
          required: false
          description: "Number of matching sessions to skip."
          schema:
            type: integer
            minimum: 0
            default: 0
          
        - name: from
          in: query
          required: false
          description: "Earliest UTC start date to include. May be used alone."
          schema:
            type: string
            format: date
        
        - name: to
          in: query
          required: false
          description: "Latest UTC start date to include. When both dates are supplied, to must be on or after from."
          schema:
            type: string
            format: date

      responses:
        '200':
          description: "Page of matching sessions. An empty page has an empty items array."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
        
        '400':
          description: "INVALID_QUERY_PARAMETERS: invalid status, invalid pagination, invalid date format, or from later than to."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: "UNAUTHENTICATED: authentication is missing or invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    
    post:
      tags:
        - Sessions
      summary: Start a workout session
      description: "Starts a workout for the authenticated user and records the server's current time. Each user can have at most one active session, including when requests arrive concurrently."
      operationId: createSession
      security:
        - bearerAuth: []

      responses:
        '201':
          description: "New active session with finishedAt set to null. Location identifies the session."
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

        '401':
          description: "UNAUTHENTICATED: authentication is missing or invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: "ACTIVE_SESSION_EXISTS: the user already has an active session."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        description: "Identifier of the workout session."
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Sessions
      summary: Get a workout with its exercises and sets
      description: "Returns the user's active or completed workout with every exercise and set. Exercises appear in the order added, and sets appear in logging order within each exercise."
      operationId: getSession
      security:
        - bearerAuth: []

      responses:
        '200':
          description: "Session details with all exercise entries and their sets."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetails'

        '401':
          description: "UNAUTHENTICATED: authentication is missing or invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: "RESOURCE_NOT_FOUND: session does not exist or belongs to another user."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    patch:
      tags:
        - Sessions
      summary: Complete a workout session
      description: "Completes an active session and records the server's current time as finishedAt. At least one set must exist at completion. Individual exercises may have no sets."
      operationId: completeSession
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CompleteSessionRequest'

      responses:
        '200':
          description: "Completed session with its finish time."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

        '400':
          description: "MALFORMED_JSON: malformed JSON."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: "UNAUTHENTICATED: authentication is missing or invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: "RESOURCE_NOT_FOUND: session does not exist or belongs to another user."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: "SESSION_ALREADY_COMPLETED: session is already completed. SESSION_HAS_NO_SETS: session contains no logged sets."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '415':
          description: "UNSUPPORTED_MEDIA_TYPE: the request Content-Type is not supported by this endpoint."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '422':
          description: "VALIDATION_FAILED: wrong JSON structure, unknown fields, or missing or invalid status."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags:
        - Sessions
      summary: Delete a workout session
      description: "Deletes an active or completed session owned by the user, including all its exercise entries and sets."
      operationId: deleteSession
      security:
        - bearerAuth: []

      responses:
        '204':
          description: "Session and its contents deleted."
        
        '401':
          description: "UNAUTHENTICATED: authentication is missing or invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: "RESOURCE_NOT_FOUND: session does not exist or belongs to another user."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /sessions/{sessionId}/exercises:
    parameters:
      - name: sessionId
        in: path
        required: true
        description: "Identifier of the workout session."
        schema:
          type: string
          format: uuid

    post:
      tags:
        - SessionExercises
      summary: Add an exercise to a workout
      description: "Adds a catalogue exercise to the user's active workout. The service looks up the exercise and saves its catalogue ID and current name. Each catalogue exercise can appear once per workout."
      operationId: addSessionExercise
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddExerciseRequest'

      responses:
        '201':
          description: "Created exercise entry with its saved name. Location identifies the entry."
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
        
        '400':
          description: "MALFORMED_JSON: malformed JSON."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: "UNAUTHENTICATED: authentication is missing or invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: "RESOURCE_NOT_FOUND: session does not exist or belongs to another user."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: "SESSION_ALREADY_COMPLETED: session is already completed. EXERCISE_ALREADY_ADDED: the same catalogue exercise is already in the session."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '415':
          description: "UNSUPPORTED_MEDIA_TYPE: the request Content-Type is not supported by this endpoint."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '422':
          description: "VALIDATION_FAILED: wrong JSON structure, unknown fields, missing or invalid catalogueExerciseId, or referenced catalogue exercise does not exist."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '503':
          description: "CATALOGUE_UNAVAILABLE: catalogue is temporarily unavailable."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /sessions/{sessionId}/exercises/{entryId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        description: "Identifier of the workout session."
        schema:
          type: string
          format: uuid

      - name: entryId
        in: path
        required: true
        description: "Identifier of the exercise entry in the workout."
        schema:
          type: string
          format: uuid

    delete:
      tags:
        - SessionExercises
      summary: Remove an exercise and its sets
      description: "Removes an exercise entry and its sets from an active or completed workout. A completed workout stays in history even if it becomes empty."
      operationId: deleteSessionExercise
      security:
        - bearerAuth: []

      responses:
        '204':
          description: "Exercise entry and its sets deleted."
        
        '401':
          description: "UNAUTHENTICATED: authentication is missing or invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: "RESOURCE_NOT_FOUND: a referenced resource is missing, inaccessible, or does not belong to the parent specified in the URL."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /session-exercises/{entryId}/sets:
    parameters:
      - name: entryId
        in: path
        required: true
        description: "Identifier of the exercise entry in the workout."
        schema:
          type: string
          format: uuid

    post:
      tags:
        - Sets
      summary: Log a set for an exercise
      description: "Records weight and repetitions for an exercise entry in the user's active workout."
      operationId: createSet
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSetRequest'

      responses:
        '201':
          description: "Created set. Location identifies the set."
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Set'

        '400':
          description: "MALFORMED_JSON: malformed JSON."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: "UNAUTHENTICATED: authentication is missing or invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: "RESOURCE_NOT_FOUND: session or exercise entry does not exist or belongs to another user."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '409':
          description: "SESSION_ALREADY_COMPLETED: session is already completed."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '415':
          description: "UNSUPPORTED_MEDIA_TYPE: the request Content-Type is not supported by this endpoint."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '422':
          description: "VALIDATION_FAILED: wrong JSON structure, unknown fields, or missing or invalid weightKg or reps."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /session-exercises/{entryId}/sets/{setId}:
    parameters:
      - name: entryId
        in: path
        required: true
        description: "Identifier of the exercise entry in the workout."
        schema:
          type: string
          format: uuid

      - name: setId
        in: path
        required: true
        description: "Identifier of the logged set within the specified exercise entry."
        schema:
          type: string
          format: uuid

    patch:
      tags:
        - Sets
      summary: Edit a logged set
      description: "Corrects the weight, repetitions, or both for a set in an active or completed workout. Omitted fields keep their current values."
      operationId: updateSet
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateSetRequest'

      responses:
        '200':
          description: "Updated set with its current weight and repetitions."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Set'

        '400':
          description: "MALFORMED_JSON: malformed JSON."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '401':
          description: "UNAUTHENTICATED: authentication is missing or invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: "RESOURCE_NOT_FOUND: a referenced resource is missing, inaccessible, or does not belong to the parent specified in the URL."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '415':
          description: "UNSUPPORTED_MEDIA_TYPE: the request Content-Type is not supported by this endpoint."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '422':
          description: "VALIDATION_FAILED: wrong JSON structure, unknown fields, neither editable field supplied, or an invalid supplied value."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

    delete:
      tags:
        - Sets
      summary: Delete a logged set
      description: "Removes a set from an active or completed workout. Deleting the last set from a completed workout leaves the workout in history."
      operationId: deleteSet
      security:
        - bearerAuth: []
      
      responses:
        '204':
          description: "Set deleted."
        
        '401':
          description: "UNAUTHENTICATED: authentication is missing or invalid."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

        '404':
          description: "RESOURCE_NOT_FOUND: a referenced resource is missing, inaccessible, or does not belong to the parent specified in the URL."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    Session:
      description: "Workout status and start and finish times."
      type: object
      required:
        - id
        - startedAt
        - finishedAt
        - status
      properties:
        id:
          description: "Identifier of the workout session."
          type: string
          format: uuid

        startedAt:
          description: "UTC timestamp when the session started."
          type: string
          format: date-time
          examples:
            - "2026-11-19T17:30:00Z"
        
        finishedAt:
          description: "UTC timestamp when the session finished, or null while active."
          type: [string, "null"]
          format: date-time
          examples: 
            - null
            - "2026-11-19T18:15:00Z"

        status:
          description: "Current state of the workout."
          type: string
          enum:
            - ACTIVE
            - COMPLETED

    SessionDetails:
      description: "Workout with its exercises and logged sets."
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required:
            - exercises
          properties:
            exercises:
              type: array
              items:
                $ref: '#/components/schemas/ExerciseDetails'

    SessionPage:
      description: "One page of workout session summaries."
      type: object
      required:
        - items
        - limit
        - offset
        - total
      properties:
        items:
          description: "Matching sessions on this page."
          type: array
          items:
            $ref: '#/components/schemas/Session'

        limit:
          description: "Page size used for this response."
          type: integer
          minimum: 1
          maximum: 100

        offset:
          description: "Number of matches skipped for this page."
          type: integer
          minimum: 0
        
        total:
          description: "Number of matching sessions before pagination."
          type: integer
          minimum: 0
        

    Exercise:
      description: "Exercise added to a workout, with the name saved at selection time."
      type: object
      required:
        - id
        - catalogueExerciseId
        - name
      properties:
        id:
          description: "Identifier assigned to this exercise entry in the workout."
          type: string
          format: uuid

        catalogueExerciseId:
          description: Unique identifier of the catalogue exercise.
          type: string
          format: uuid

        name:
          description: Display name of the exercise.
          type: string
        
    ExerciseDetails:
      description: "Exercise entry with its sets in logging order."
      allOf:
        - $ref: '#/components/schemas/Exercise'
        - type: object
          required:
            - sets
          properties:
            sets:
              description: "Sets in the order they were logged for this entry."
              type: array
              items:
                $ref: '#/components/schemas/Set'
        
    Set:
      description: "Weight and repetitions recorded for one set."
      type: object
      required:
        - id
        - weightKg
        - reps
      properties:
        id:
          description: "Identifier of the logged set."
          type: string
          format: uuid

        weightKg:
          description: "Weight used for the set, in kilograms."
          type: number
          minimum: 0
        
        reps:
          description: "Number of repetitions performed."
          type: integer
          minimum: 1

    CompleteSessionRequest:
      description: "Status change used to finish an active workout."
      type: object
      required:
        - status
      properties:
        status:
          description: "Set to COMPLETED to finish the session."
          type: string
          const: COMPLETED
      additionalProperties: false

    AddExerciseRequest:
      description: "Catalogue exercise to add to the workout."
      type: object
      required:
        - catalogueExerciseId
      properties:
        catalogueExerciseId:
          description: "Identifier of the exercise in the shared catalogue."
          type: string
          format: uuid
      additionalProperties: false

    CreateSetRequest:
      description: "Weight and repetitions for a new set."
      type: object
      required:
        - weightKg
        - reps
      properties:
        weightKg:
          description: "Weight used for the set, in kilograms."
          type: number
          minimum: 0
        
        reps:
          description: "Number of repetitions performed."
          type: integer
          minimum: 1
      additionalProperties: false
    
    UpdateSetRequest:
      description: "Corrections to a logged set. Supply at least one field."
      type: object
      minProperties: 1
      properties:
        weightKg:
          description: "Weight used for the set, in kilograms."
          type: number
          minimum: 0
        
        reps:
          description: "Number of repetitions performed."
          type: integer
          minimum: 1
      additionalProperties: false

    Problem:
      description: >
        Standard error response following RFC 9457 Problem Details.
        Used by both services to provide consistent error information.
        Includes an application-specific error code and optional
        field-level validation errors.
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          const: "about:blank"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
      
      additionalProperties: true

  headers:
    Location:
      description: URI of the newly created resource.
      required: true
      schema:
        type: string
        format: uri-reference

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
